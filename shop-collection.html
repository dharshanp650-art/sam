<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SAMANTHA</title>
    <link rel="stylesheet" href="styles.css">
    <style>
      /* Make header appear scrolled on shop page */
      .site-header {
        background: rgba(255, 255, 255, 0.95) !important;
        backdrop-filter: blur(12px) !important;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08) !important;
      }

      .site-header .logo {
        color: var(--fg) !important;
      }

      .site-header .nav-left a,
      .site-header .nav-right a {
        color: var(--fg) !important;
      }

      .site-header .icon-btn {
        color: var(--fg) !important;
      }

      .site-header .hamburger-menu span {
        background: var(--fg) !important;
      }

      .site-header .dropdown-toggle {
        color: var(--fg) !important;
        border-bottom-color: transparent !important;
      }

      .site-header .dropdown-toggle:hover {
        border-bottom-color: var(--fg) !important;
      }

      .site-header .dropdown.active .dropdown-toggle {
        border-bottom-color: var(--fg) !important;
      }

      .site-header .dropdown-toggle::after {
        border-right-color: var(--fg) !important;
        border-bottom-color: var(--fg) !important;
      }

      .site-header .dropdown-menu a {
        color: var(--fg) !important;
      }

      .site-header .dropdown-menu a::before {
        background: var(--fg) !important;
      }

      .shop-page {
        min-height: 100vh;
        padding: 100px 80px 80px;
        background: var(--bg);
      }

      .products-header {
        text-align: center;
        margin-bottom: 80px;
        margin-top: 15px;
      }

      .products-header h1 {
        font-size: 2rem;
        font-weight: 600;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-family: 'Georgia', serif;
        margin: 0;
      }

      .breadcrumb {
        font-size: 0.75rem;
        color: var(--muted);
        letter-spacing: 0.06em;
        margin-bottom: 40px;
        margin-top: 0;
      }

      .breadcrumb a {
        color: var(--muted);
        text-decoration: none;
      }

      .breadcrumb a:hover {
        text-decoration: underline;
      }

      /* Layout: left sidebar for filters, main area for products */
      .products-controls {
        display: flex;
        gap: 40px;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0; /* removed extra gap between filters and separator */
      }

      /* Filter Bar */
      .filter-bar {
        display: flex;
        gap: 32px;
        width: 100%;
        align-items: flex-start;
      }

      .filter-item {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
        position: relative; /* anchor absolute dropdown */
      }

      /* Vertical divider after each filter toggle (except last) - attached to the toggle for proper vertical alignment */
      .filter-item:not(:last-child) .filter-toggle::before {
        content: "";
        display: inline-block;
        width: 1px;
        height: 18px;
        background: #efefef;
        margin-left: 10px;
        margin-right: 6px;
        vertical-align: middle;
        opacity: 0.9;
      }

      .filter-toggle {
        background: transparent;
        border: none;
        padding: 6px 4px;
        font-size: 0.9rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .filter-toggle.active { color: var(--fg); }

      /* Filter options are hidden by default in sidebar; toggled open via .open on .filter-item */
      .filter-options {
        display: none;
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        background: var(--bg);
        padding: 10px 12px;
        border-radius: 4px;
        box-shadow: 0 6px 18px rgba(16,24,40,0.06);
        min-width: 180px;
        z-index: 60;
        flex-direction: column;
        gap: 8px;
      }

      .filter-item.open .filter-options {
        display: flex;
      }

      /* Arrow indicator on the toggle */
      .filter-toggle::after {
        content: '\25B6';
        display: inline-block;
        margin-left: 6px;
        transform: rotate(0deg);
        transition: transform 0.18s ease, opacity 0.18s ease;
        font-size: 0.85em;
        color: var(--muted);
        opacity: 0.5; /* light arrow */
      }

      .filter-item.open .filter-toggle::after {
        transform: rotate(90deg);
        color: var(--fg);
        opacity: 0.9;
      }

      .filters-sidebar {
        flex: 0 0 220px;
        max-width: 240px;
      }

      .filters-sidebar .filter-bar {
        display: flex;
        flex-direction: row;
        gap: 12px;
        align-items: center;
      }

      .controls-right {
        display: flex;
        align-items: center;
        justify-content: flex-end;
      }

      .filters-separator {
        height: 1px;
        background: #efefef;
        margin: 8px 0 48px; /* increased space below the line */
        width: 100%;
      }

      .controls-after-line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .controls-after-line .breadcrumb {
        font-size: 0.85rem;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .controls-after-line { flex-direction: column; align-items: flex-start; }
      }

        /* Active filter area shown after clicking a filter toggle */
        .active-filter-area {
          display: none;
          gap: 12px;
          align-items: center;
          flex-wrap: wrap;
          width: 100%;
        }

        /* When a filter is open, hide breadcrumb and show options area with a bottom line */
        .controls-after-line.filter-open .breadcrumb {
          display: none;
        }

        .controls-after-line.filter-open .active-filter-area {
          display: flex;
          padding: 8px 0 12px;
          border-bottom: 1px solid #efefef;
        }

      .products-main {
        flex: 1 1 0;
      }

      .filter-options label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        font-size: 0.95rem;
        color: var(--fg);
        white-space: nowrap;
      }

      .filter-options input[type="checkbox"]{width:16px;height:16px}

      .products-sort-section {
        display: flex;
        align-items: center;
        gap: 25px;
        margin-left: auto;
      }

      .products-sort-container {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .products-sort-label {
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        font-weight: 500;
        white-space: nowrap;
      }

      .sort-select {
        appearance: none;
        background: transparent;
        border: 1px solid #ccc;
        padding: 5px 20px 5px 8px;
        font-size: 0.7rem;
        cursor: pointer;
        color: var(--fg);
        font-family: inherit;
        letter-spacing: 0.05em;
        position: relative;
      }

      .sort-select:focus {
        outline: none;
        border-color: var(--fg);
      }

      /* Products Grid */
      .products-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        column-gap: 48px;
        row-gap: 80px; /* larger vertical spacing between rows */
        margin-top: 40px; /* more space above first row */
        margin-bottom: 100px;
        justify-items: center;
      }

      .product-card {
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
      }

      .product-frame {
        position: relative;
        aspect-ratio: 1 / 1;
        border: 6px solid #1a1a1a;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background: #f5f5f5;
        max-width: 240px;
        width: 100%;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }

      .product-frame:hover {
        border-color: #000;
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.15), 0 20px 40px rgba(0, 0, 0, 0.25);
      }

      .product-frame.frame-light {
        border-color: #d5d5d5;
        background: #fff;
      }

      .product-frame.frame-light:hover {
        border-color: #1a1a1a;
        box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.1), 0 20px 40px rgba(0, 0, 0, 0.18);
      }

      .product-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .product-frame .quick-view {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        opacity: 0;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }

      .product-frame:hover .quick-view {
        opacity: 1;
        pointer-events: auto;
      }

      .product-frame .quick-view button {
        background: rgba(255, 255, 255, 0.95);
        color: #0f1419;
        border: none;
        padding: 6px 16px;
        font-size: 0.6rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.3s ease;
      }

      .product-frame .quick-view button:hover {
        background: transparent;
        color: white;
        border: 1px solid white;
      }

      .product-info {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .product-title {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin: 0;
        color: var(--fg);
      }

      .product-price {
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        margin: 0;
        color: var(--fg);
      }

      .artist-name {
        font-size: 0.65rem;
        color: var(--muted);
        letter-spacing: 0.08em;
        margin: 0;
      }

      .product-title {
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin: 0;
        color: var(--fg);
      }

      .product-price {
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        margin: 0;
        color: var(--fg);
      }

      @media (max-width: 1200px) {
        .products-grid {
          grid-template-columns: repeat(3, 1fr);
          column-gap: 28px;
          row-gap: 56px;
        }
      }

      @media (max-width: 900px) {
        .shop-page {
          padding: 80px 30px 40px;
        }

        .products-grid {
          grid-template-columns: repeat(2, 1fr);
          column-gap: 20px;
          row-gap: 48px;
        }

        .filter-bar {
          gap: 25px;
        }

        .products-controls {
          flex-direction: column;
          gap: 20px;
          align-items: flex-start;
        }

        .products-sort-section {
          width: 100%;
          margin-left: 0;
          justify-content: flex-start;
        }

        .products-header h1 {
          font-size: 1.8rem;
        }
      }

      @media (max-width: 640px) {
        .shop-page {
          padding: 70px 20px 30px;
        }

        .products-grid {
          grid-template-columns: 1fr;
        }

        .products-header h1 {
          font-size: 1.5rem;
        }

        .filter-bar,
        .filters-sidebar .filter-bar {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }

        .filters-sidebar {
          flex: 1 1 100%;
          max-width: 100%;
          width: 100%;
        }

        /* JS moves the checked filter-options into a horizontal row (inline
           styles) for the desktop "pill" layout; force it back to a wrapping
           column on mobile so options don't get clipped off-screen. */
        .filter-options {
          flex-direction: column !important;
          align-items: flex-start !important;
          gap: 10px !important;
          width: 100%;
        }

        .active-filter-area {
          width: 100%;
        }

        .products-controls {
          flex-direction: column;
          gap: 12px;
          align-items: flex-start;
        }

        /* hide vertical dividers on small screens */
        .filter-item:not(:last-child) .filter-toggle::before { display: none; }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <button class="hamburger-menu" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav-left">
        <a href="shop-collection.html">GALLERY</a>
        <a href="blog.html">BLOG</a>
      </nav>
      <div class="logo"><img src="logo-header.png" alt="Samantha Logo"></div>
      <nav class="nav-right">
        <a href="artist-profile.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
        <button class="icon-btn cart-icon-btn" aria-label="Cart">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8.5 9V7.5a3.5 3.5 0 0 1 7 0V9"/>
            <path d="M6.2 9h11.6l0.9 10.4a3 3 0 0 1-3 3.3H8.3a3 3 0 0 1-3-3.3L6.2 9Z"/>
            <path d="M8.7 12.4a3.3 3.3 0 0 0 6.6 0"/>
          </svg>
          <span class="cart-badge" id="cartBadge" aria-hidden="true"></span>
        </button>
      </nav>

      <!-- Mobile Menu -->
      <nav class="mobile-menu">
        <a href="shop-collection.html">COLLECTIONS</a>
        <a href="blog.html">BLOG</a>
        <a href="artist-profile.html">ABOUT</a>
        <a href="contact.html">CONTACT</a>
      </nav>
    </header>

    <div class="shop-page">
      <div class="products-header">
        <h1></h1>
      </div>

      <div class="products-controls">
        <aside class="filters-sidebar" aria-label="Filters">
          <div class="filter-bar">

            

            
            <div class="filter-item">
              <button class="filter-toggle" data-target="price-options">Price</button>
              <div class="filter-options" id="price-options">
                <label><input type="checkbox" value="under-100"> Under £100</label>
                <label><input type="checkbox" value="100-250"> £100 - £250</label>
                <label><input type="checkbox" value="250-500"> £250 - £500</label>
                <label><input type="checkbox" value="over-500"> Over £500</label>
              </div>
            </div>
          </div>
        </aside>

        <div class="controls-right">
          <div class="products-sort-section">
            <div class="products-sort-container">
              <span class="products-sort-label">Category:</span>
              <select class="sort-select" id="categorySelect">
                <option value="">All Categories</option>
                <option value="clouds">Clouds</option>
                <option value="stars">Stars</option>
                <option value="natural-disasters">Natural Disasters</option>
                <option value="landscapes">Landscapes</option>
                <option value="drawings">Drawings</option>
                <option value="exhibition">Exhibition</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <div class="filters-separator" aria-hidden="true"></div>

      <div class="controls-after-line">
        <div class="active-filter-area" aria-hidden="true"></div>
      </div>

      <script>
        // Toggle each filter group's visibility by toggling .open on its .filter-item
        document.addEventListener('DOMContentLoaded', function(){
          const toggles = document.querySelectorAll('.filter-toggle');
          toggles.forEach(btn=>{
            btn.addEventListener('click', ()=>{
              const item = btn.closest('.filter-item');
              if(!item) return;
              const id = btn.getAttribute('data-target');
              const optionsEl = document.getElementById(id);

              // controls row and active area
              const controls = document.querySelector('.controls-after-line');
              const activeArea = document.querySelector('.active-filter-area');

              // close other open filters and move their options back if needed
              document.querySelectorAll('.filter-item.open').forEach(o=>{
                if(o !== item) {
                  o.classList.remove('open');
                  const otherId = o.querySelector('.filter-toggle')?.getAttribute('data-target');
                  const otherOptions = otherId ? document.getElementById(otherId) : null;
                  if(otherOptions && activeArea.contains(otherOptions)){
                    o.appendChild(otherOptions);
                    otherOptions.style.position = '';
                    otherOptions.style.display = '';
                    otherOptions.style.flexDirection = '';
                    otherOptions.style.alignItems = '';
                    otherOptions.style.gap = '';
                  }
                }
              });

              // toggle this item
              const isOpen = item.classList.toggle('open');

              if(isOpen && optionsEl){
                // move the actual options element into the active area so inputs remain interactive
                if(!activeArea.contains(optionsEl)){
                  activeArea.innerHTML = '';
                  activeArea.appendChild(optionsEl);
                  // make it horizontal and visible
                  optionsEl.style.position = 'static';
                  optionsEl.style.display = 'flex';
                  optionsEl.style.flexDirection = 'row';
                  optionsEl.style.alignItems = 'center';
                  optionsEl.style.gap = '12px';
                }

                controls.classList.add('filter-open');
                activeArea.setAttribute('aria-hidden','false');
              } else {
                // move the options back into the filter item and restore styles
                if(optionsEl && activeArea.contains(optionsEl)){
                  item.appendChild(optionsEl);
                  optionsEl.style.position = '';
                  optionsEl.style.display = '';
                  optionsEl.style.flexDirection = '';
                  optionsEl.style.alignItems = '';
                  optionsEl.style.gap = '';
                }
                controls.classList.remove('filter-open');
                activeArea.innerHTML = '';
                activeArea.setAttribute('aria-hidden','true');
                item.classList.remove('open');
              }
            });
          });
        });
      </script>

      <div class="products-grid"></div>
    </div>

    <script src="products-data.js"></script>
    <script src="script.js"></script>
    <script>
      // Apply filters based on checked boxes in the filter options + the category select
      function applyFilters(){
        const selected = {
          artist: Array.from(document.querySelectorAll('#artist-options input[type="checkbox"]:checked')).map(i=>i.value),
          size: Array.from(document.querySelectorAll('#size-options input[type="checkbox"]:checked')).map(i=>i.value),
          frame: Array.from(document.querySelectorAll('#frame-options input[type="checkbox"]:checked')).map(i=>i.value),
          price: Array.from(document.querySelectorAll('#price-options input[type="checkbox"]:checked')).map(i=>i.value)
        };
        const category = document.getElementById('categorySelect')?.value || '';

        const cards = document.querySelectorAll('.product-card');
        cards.forEach(card=>{
          const artist = card.dataset.artist || '';
          const size = card.dataset.size || '';
          const frame = card.dataset.frame || '';
          const price = Number(card.dataset.price || 0);
          let visible = true;

          if(selected.artist.length && !selected.artist.includes(artist)) visible = false;
          if(selected.size.length && !selected.size.includes(size)) visible = false;
          if(selected.frame.length && !selected.frame.includes(frame)) visible = false;
          if(category && card.dataset.category !== category) visible = false;

          if(selected.price.length){
            const match = selected.price.some(range=>{
              if(range==='under-100') return price < 100;
              if(range==='100-250') return price >= 100 && price <= 250;
              if(range==='250-500') return price > 250 && price <= 500;
              if(range==='over-500') return price > 500;
              return false;
            });
            if(!match) visible = false;
          }

          card.style.display = visible ? '' : 'none';
        });
      }

      document.addEventListener('DOMContentLoaded', function(){
        // Attach change listeners to checkboxes (both in original sidebar and moved active area — it's the same element)
        document.querySelectorAll('.filter-options input[type="checkbox"]').forEach(cb=>{
          cb.addEventListener('change', applyFilters);
        });

        document.getElementById('categorySelect')?.addEventListener('change', applyFilters);

        applyFilters();
      });
    </script>
  </body>
</html>
